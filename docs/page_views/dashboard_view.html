<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Overview View</title>
    <link rel="stylesheet" href="assets/preview.css">
</head>
<body>
    <main class="screen app-shell">
        <aside class="sidebar">
            <div class="signed">Signed in as admin</div>
            <div class="brand">Dashboard</div>
            <nav class="nav">
                <a class="active" href="#">Overview</a><a href="#">Students</a><a href="#">Teachers</a><a href="#">Classes</a><a href="#">Presence</a><a href="#">Settings</a><a href="#">Open Camera</a>
            </nav>
            <a class="btn btn-dark logout" href="#">Logout</a>
        </aside>
        <section class="content">
            <div class="top-tools">
                <div class="tool-form"><span>Search</span><div class="small-input"></div><span>Show</span><div class="small-input" style="width:70px;">25</div><a class="btn btn-primary" style="min-height:34px;" href="#">Apply</a></div>
                <div class="helper">Page 1 of 3</div>
            </div>
            <div class="section-head"><div><h2>Overview</h2><p class="helper">System snapshot for active data.</p></div></div>
            <div class="cards">
                <div class="stat-card"><div class="stat-label">Students</div><div class="stat-value">128</div></div>
                <div class="stat-card"><div class="stat-label">Teachers</div><div class="stat-value">18</div></div>
                <div class="stat-card"><div class="stat-label">Classes</div><div class="stat-value">24</div></div>
                <div class="stat-card"><div class="stat-label">Users</div><div class="stat-value">4</div></div>
            </div>
        </section>
    </main>
</body>
</html>
