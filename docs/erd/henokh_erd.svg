<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="980" viewBox="0 0 1480 980" role="img" aria-labelledby="title desc">
  <title id="title">Henokh Project Crow's Foot ERD</title>
  <desc id="desc">Entity relationship diagram for users, app settings, teachers, students, classes, class_students, and attendances.</desc>
  <defs>
    <style>
      .page { fill: #f7f8fb; }
      .entity { fill: #ffffff; stroke: #243047; stroke-width: 2; }
      .header { fill: #243047; }
      .headerText { fill: #ffffff; font: 700 18px Arial, sans-serif; }
      .field { fill: #263247; font: 14px Arial, sans-serif; }
      .key { fill: #0f766e; font: 700 14px Arial, sans-serif; }
      .note { fill: #6b7280; font: 12px Arial, sans-serif; }
      .rel { stroke: #45556f; stroke-width: 2.5; fill: none; }
      .crow { stroke: #45556f; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .label { fill: #334155; font: 13px Arial, sans-serif; }
      .title { fill: #111827; font: 700 30px Arial, sans-serif; }
      .subtitle { fill: #4b5563; font: 15px Arial, sans-serif; }
      .legendBox { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="page" width="1480" height="980"/>

  <text class="title" x="60" y="58">Henokh Project ERD</text>
  <text class="subtitle" x="60" y="86">Crow's-foot relationship visualization based on models/db_models.py</text>

  <g id="teachers" transform="translate(80 160)">
    <rect class="entity" width="300" height="210" rx="8"/>
    <rect class="header" width="300" height="42" rx="8"/>
    <path class="header" d="M0 34 H300 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">TEACHERS</text>
    <text class="key" x="18" y="70">PK</text><text class="field" x="58" y="70">id</text>
    <text class="field" x="58" y="96">name</text>
    <text class="key" x="18" y="122">UK</text><text class="field" x="58" y="122">NIP</text>
    <text class="field" x="58" y="148">subject</text><text class="note" x="154" y="148">nullable</text>
    <text class="field" x="58" y="174">deleted_at</text><text class="note" x="154" y="174">nullable</text>
    <text class="field" x="58" y="200">created_at</text>
  </g>

  <g id="classes" transform="translate(580 130)">
    <rect class="entity" width="320" height="315" rx="8"/>
    <rect class="header" width="320" height="42" rx="8"/>
    <path class="header" d="M0 34 H320 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">CLASSES</text>
    <text class="key" x="18" y="70">PK</text><text class="field" x="58" y="70">id</text>
    <text class="field" x="58" y="96">name</text>
    <text class="key" x="18" y="122">UK</text><text class="field" x="58" y="122">class_code</text>
    <text class="key" x="18" y="148">FK</text><text class="field" x="58" y="148">teacher_id</text><text class="note" x="174" y="148">nullable</text>
    <text class="field" x="58" y="174">start_time</text><text class="note" x="174" y="174">nullable</text>
    <text class="field" x="58" y="200">end_time</text><text class="note" x="174" y="200">nullable</text>
    <text class="field" x="58" y="226">start_presence</text><text class="note" x="174" y="226">nullable</text>
    <text class="field" x="58" y="252">end_presence</text><text class="note" x="174" y="252">nullable</text>
    <text class="field" x="58" y="278">deleted_at</text><text class="note" x="174" y="278">nullable</text>
    <text class="field" x="58" y="304">created_at, updated_at</text>
  </g>

  <g id="students" transform="translate(1080 160)">
    <rect class="entity" width="320" height="235" rx="8"/>
    <rect class="header" width="320" height="42" rx="8"/>
    <path class="header" d="M0 34 H320 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">STUDENTS</text>
    <text class="key" x="18" y="70">PK</text><text class="field" x="58" y="70">id</text>
    <text class="field" x="58" y="96">name</text>
    <text class="key" x="18" y="122">UK</text><text class="field" x="58" y="122">NIM</text>
    <text class="field" x="58" y="148">face_embeddings</text><text class="note" x="190" y="148">nullable JSON</text>
    <text class="field" x="58" y="174">deleted_at</text><text class="note" x="190" y="174">nullable</text>
    <text class="field" x="58" y="200">created_at</text>
    <text class="field" x="58" y="226">updated_at</text>
  </g>

  <g id="class_students" transform="translate(585 560)">
    <rect class="entity" width="310" height="118" rx="8"/>
    <rect class="header" width="310" height="42" rx="8"/>
    <path class="header" d="M0 34 H310 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">CLASS_STUDENTS</text>
    <text class="key" x="18" y="70">PK/FK</text><text class="field" x="86" y="70">class_id</text>
    <text class="key" x="18" y="96">PK/FK</text><text class="field" x="86" y="96">student_id</text>
  </g>

  <g id="attendances" transform="translate(1030 540)">
    <rect class="entity" width="370" height="255" rx="8"/>
    <rect class="header" width="370" height="42" rx="8"/>
    <path class="header" d="M0 34 H370 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">ATTENDANCES</text>
    <text class="key" x="18" y="70">PK</text><text class="field" x="58" y="70">id</text>
    <text class="key" x="18" y="96">FK</text><text class="field" x="58" y="96">class_id</text>
    <text class="key" x="18" y="122">FK</text><text class="field" x="58" y="122">student_id</text>
    <text class="field" x="58" y="148">attendance_date</text>
    <text class="field" x="58" y="174">status</text>
    <text class="field" x="58" y="200">presence_at</text>
    <text class="field" x="58" y="226">created_at, updated_at</text>
    <text class="note" x="58" y="248">Unique: class_id + student_id + attendance_date</text>
  </g>

  <g id="users" transform="translate(80 610)">
    <rect class="entity" width="300" height="145" rx="8"/>
    <rect class="header" width="300" height="42" rx="8"/>
    <path class="header" d="M0 34 H300 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">USERS</text>
    <text class="key" x="18" y="70">PK</text><text class="field" x="58" y="70">id</text>
    <text class="key" x="18" y="96">UK</text><text class="field" x="58" y="96">username</text>
    <text class="field" x="58" y="122">password_hash</text>
    <text class="field" x="58" y="140">created_at</text>
  </g>

  <g id="app_settings" transform="translate(80 800)">
    <rect class="entity" width="300" height="120" rx="8"/>
    <rect class="header" width="300" height="42" rx="8"/>
    <path class="header" d="M0 34 H300 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">APP_SETTINGS</text>
    <text class="key" x="18" y="70">PK</text><text class="field" x="58" y="70">id</text>
    <text class="key" x="18" y="96">UK</text><text class="field" x="58" y="96">key</text>
    <text class="field" x="58" y="112">value, updated_at</text>
  </g>

  <!-- Relationship: teachers to classes -->
  <path class="rel" d="M380 265 H580"/>
  <text class="label" x="450" y="250">teaches</text>
  <line class="crow" x1="404" y1="252" x2="404" y2="278"/>
  <circle cx="558" cy="265" r="7" fill="#f7f8fb" stroke="#45556f" stroke-width="2.5"/>
  <line class="crow" x1="570" y1="252" x2="570" y2="278"/>
  <path class="crow" d="M570 265 L580 253 M570 265 L580 277"/>

  <!-- Relationship: classes to class_students -->
  <path class="rel" d="M740 445 V560"/>
  <text class="label" x="755" y="510">has</text>
  <line class="crow" x1="727" y1="468" x2="753" y2="468"/>
  <circle cx="740" cy="538" r="7" fill="#f7f8fb" stroke="#45556f" stroke-width="2.5"/>
  <line class="crow" x1="727" y1="550" x2="753" y2="550"/>
  <path class="crow" d="M740 550 L728 560 M740 550 L752 560"/>

  <!-- Relationship: students to class_students -->
  <path class="rel" d="M1080 315 H940 Q895 315 895 360 V620 H895"/>
  <text class="label" x="952" y="300">enrolls</text>
  <line class="crow" x1="1056" y1="302" x2="1056" y2="328"/>
  <circle cx="917" cy="620" r="7" fill="#f7f8fb" stroke="#45556f" stroke-width="2.5"/>
  <line class="crow" x1="905" y1="607" x2="905" y2="633"/>
  <path class="crow" d="M905 620 L895 608 M905 620 L895 632"/>

  <!-- Relationship: classes to attendances -->
  <path class="rel" d="M900 372 H970 Q1030 372 1030 545"/>
  <text class="label" x="935" y="356">records</text>
  <line class="crow" x1="923" y1="359" x2="923" y2="385"/>
  <circle cx="1030" cy="522" r="7" fill="#f7f8fb" stroke="#45556f" stroke-width="2.5"/>
  <line class="crow" x1="1017" y1="532" x2="1043" y2="532"/>
  <path class="crow" d="M1030 532 L1018 545 M1030 532 L1042 545"/>

  <!-- Relationship: students to attendances -->
  <path class="rel" d="M1240 395 V540"/>
  <text class="label" x="1255" y="475">has</text>
  <line class="crow" x1="1227" y1="418" x2="1253" y2="418"/>
  <circle cx="1240" cy="518" r="7" fill="#f7f8fb" stroke="#45556f" stroke-width="2.5"/>
  <line class="crow" x1="1227" y1="530" x2="1253" y2="530"/>
  <path class="crow" d="M1240 530 L1228 540 M1240 530 L1252 540"/>

  <g id="legend" transform="translate(455 820)">
    <rect class="legendBox" width="500" height="100" rx="8"/>
    <text class="field" x="18" y="30">Legend</text>
    <text class="note" x="18" y="56">PK = Primary Key, FK = Foreign Key, UK = Unique Key</text>
    <text class="note" x="18" y="78">Circle means optional zero; crow's foot means many; single bar means one.</text>
  </g>
</svg>
