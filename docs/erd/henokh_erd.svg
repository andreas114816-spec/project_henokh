<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Henokh Project Crow's Foot ERD</title>
  <desc id="desc">A clean crow's-foot entity relationship diagram for the Henokh project database model.</desc>
  <defs>
    <style>
      .page { fill: #f8fafc; }
      .entity { fill: #ffffff; stroke: #263247; stroke-width: 2; }
      .header { fill: #263247; }
      .headerText { fill: #ffffff; font: 700 18px Arial, sans-serif; }
      .field { fill: #263247; font: 14px Arial, sans-serif; }
      .key { fill: #0f766e; font: 700 14px Arial, sans-serif; }
      .note { fill: #64748b; font: 12px Arial, sans-serif; }
      .rel { stroke: #475569; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
      .mark { stroke: #475569; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .labelBox { fill: #f8fafc; }
      .label { fill: #334155; font: 13px Arial, sans-serif; }
    </style>
  </defs>

  <rect class="page" width="1600" height="1060"/>

  <!-- Top row -->
  <g id="teachers" transform="translate(70 140)">
    <rect class="entity" width="300" height="210" rx="8"/>
    <rect class="header" width="300" height="42" rx="8"/>
    <path class="header" d="M0 34 H300 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">TEACHERS</text>
    <text class="key" x="18" y="70">PK</text><text class="field" x="58" y="70">id</text>
    <text class="field" x="58" y="96">name</text>
    <text class="key" x="18" y="122">UK</text><text class="field" x="58" y="122">NIP</text>
    <text class="field" x="58" y="148">deleted_at</text><text class="note" x="154" y="148">nullable</text>
    <text class="field" x="58" y="174">created_at</text>
  </g>

  <g id="classes" transform="translate(560 110)">
    <rect class="entity" width="320" height="315" rx="8"/>
    <rect class="header" width="320" height="42" rx="8"/>
    <path class="header" d="M0 34 H320 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">CLASSES</text>
    <text class="key" x="18" y="70">PK</text><text class="field" x="58" y="70">id</text>
    <text class="field" x="58" y="96">name</text>
    <text class="key" x="18" y="122">UK</text><text class="field" x="58" y="122">class_code</text>
    <text class="key" x="18" y="148">FK</text><text class="field" x="58" y="148">teacher_id</text><text class="note" x="174" y="148">nullable</text>
    <text class="field" x="58" y="174">start_time</text><text class="note" x="174" y="174">nullable</text>
    <text class="field" x="58" y="200">end_time</text><text class="note" x="174" y="200">nullable</text>
    <text class="field" x="58" y="226">start_presence</text><text class="note" x="174" y="226">nullable</text>
    <text class="field" x="58" y="252">end_presence</text><text class="note" x="174" y="252">nullable</text>
    <text class="field" x="58" y="278">deleted_at</text><text class="note" x="174" y="278">nullable</text>
    <text class="field" x="58" y="304">created_at, updated_at</text>
  </g>

  <g id="students" transform="translate(1130 140)">
    <rect class="entity" width="320" height="235" rx="8"/>
    <rect class="header" width="320" height="42" rx="8"/>
    <path class="header" d="M0 34 H320 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">STUDENTS</text>
    <text class="key" x="18" y="70">PK</text><text class="field" x="58" y="70">id</text>
    <text class="field" x="58" y="96">name</text>
    <text class="key" x="18" y="122">UK</text><text class="field" x="58" y="122">NIM</text>
    <text class="field" x="58" y="148">face_embeddings</text><text class="note" x="190" y="148">nullable JSON</text>
    <text class="field" x="58" y="174">deleted_at</text><text class="note" x="190" y="174">nullable</text>
    <text class="field" x="58" y="200">created_at</text>
    <text class="field" x="58" y="226">updated_at</text>
  </g>

  <!-- Middle row -->
  <g id="class_students" transform="translate(840 520)">
    <rect class="entity" width="320" height="118" rx="8"/>
    <rect class="header" width="320" height="42" rx="8"/>
    <path class="header" d="M0 34 H320 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">CLASS_STUDENTS</text>
    <text class="key" x="18" y="70">PK/FK</text><text class="field" x="86" y="70">class_id</text>
    <text class="key" x="18" y="96">PK/FK</text><text class="field" x="86" y="96">student_id</text>
  </g>

  <g id="attendances" transform="translate(840 790)">
    <rect class="entity" width="380" height="255" rx="8"/>
    <rect class="header" width="380" height="42" rx="8"/>
    <path class="header" d="M0 34 H380 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">ATTENDANCES</text>
    <text class="key" x="18" y="70">PK</text><text class="field" x="58" y="70">id</text>
    <text class="key" x="18" y="96">FK</text><text class="field" x="58" y="96">class_id</text>
    <text class="key" x="18" y="122">FK</text><text class="field" x="58" y="122">student_id</text>
    <text class="field" x="58" y="148">attendance_date</text>
    <text class="field" x="58" y="174">status</text>
    <text class="field" x="58" y="200">presence_at</text>
    <text class="field" x="58" y="226">created_at, updated_at</text>
    <text class="note" x="58" y="248">Unique: class_id + student_id + attendance_date</text>
  </g>

  <!-- Standalone entities -->
  <g id="users" transform="translate(70 560)">
    <rect class="entity" width="300" height="145" rx="8"/>
    <rect class="header" width="300" height="42" rx="8"/>
    <path class="header" d="M0 34 H300 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">USERS</text>
    <text class="key" x="18" y="70">PK</text><text class="field" x="58" y="70">id</text>
    <text class="key" x="18" y="96">UK</text><text class="field" x="58" y="96">username</text>
    <text class="field" x="58" y="122">password_hash</text>
    <text class="field" x="58" y="140">created_at</text>
  </g>

  <g id="app_settings" transform="translate(70 780)">
    <rect class="entity" width="300" height="120" rx="8"/>
    <rect class="header" width="300" height="42" rx="8"/>
    <path class="header" d="M0 34 H300 V42 H0 Z"/>
    <text class="headerText" x="18" y="27">APP_SETTINGS</text>
    <text class="key" x="18" y="70">PK</text><text class="field" x="58" y="70">id</text>
    <text class="key" x="18" y="96">UK</text><text class="field" x="58" y="96">key</text>
    <text class="field" x="58" y="112">value, updated_at</text>
  </g>

  <!-- TEACHERS one to CLASSES zero-many -->
  <path class="rel" d="M370 245 H560"/>
  <rect class="labelBox" x="446" y="229" width="70" height="20"/>
  <text class="label" x="456" y="244">teaches</text>
  <line class="mark" x1="393" y1="232" x2="393" y2="258"/>
  <circle cx="538" cy="245" r="7" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  <line class="mark" x1="548" y1="232" x2="548" y2="258"/>
  <path class="mark" d="M548 245 L560 232 M548 245 L560 258"/>

  <!-- CLASSES one to CLASS_STUDENTS zero-many -->
  <path class="rel" d="M720 425 V470 H930 V520"/>
  <rect class="labelBox" x="782" y="454" width="35" height="20"/>
  <text class="label" x="789" y="469">has</text>
  <line class="mark" x1="707" y1="450" x2="733" y2="450"/>
  <circle cx="930" cy="497" r="7" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  <line class="mark" x1="917" y1="508" x2="943" y2="508"/>
  <path class="mark" d="M930 508 L918 520 M930 508 L942 520"/>

  <!-- STUDENTS one to CLASS_STUDENTS zero-many, routed above middle row -->
  <path class="rel" d="M1290 375 V470 H1060 V520"/>
  <rect class="labelBox" x="1168" y="454" width="55" height="20"/>
  <text class="label" x="1178" y="469">enrolls</text>
  <line class="mark" x1="1277" y1="398" x2="1303" y2="398"/>
  <circle cx="1060" cy="497" r="7" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  <line class="mark" x1="1047" y1="508" x2="1073" y2="508"/>
  <path class="mark" d="M1060 508 L1048 520 M1060 508 L1072 520"/>

  <!-- CLASSES one to ATTENDANCES zero-many, routed in a separate lane -->
  <path class="rel" d="M650 425 V755 H920 V790"/>
  <rect class="labelBox" x="668" y="740" width="60" height="20"/>
  <text class="label" x="677" y="755">records</text>
  <line class="mark" x1="637" y1="450" x2="663" y2="450"/>
  <circle cx="920" cy="767" r="7" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  <line class="mark" x1="907" y1="778" x2="933" y2="778"/>
  <path class="mark" d="M920 778 L908 790 M920 778 L932 790"/>

  <!-- STUDENTS one to ATTENDANCES zero-many -->
  <path class="rel" d="M1450 300 H1500 V755 H1100 V790"/>
  <rect class="labelBox" x="1326" y="740" width="35" height="20"/>
  <text class="label" x="1333" y="755">has</text>
  <line class="mark" x1="1474" y1="287" x2="1474" y2="313"/>
  <circle cx="1100" cy="767" r="7" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  <line class="mark" x1="1087" y1="778" x2="1113" y2="778"/>
  <path class="mark" d="M1100 778 L1088 790 M1100 778 L1112 790"/>

</svg>
