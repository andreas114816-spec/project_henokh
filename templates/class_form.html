<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Class</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="min-h-screen bg-gray-100 text-gray-900">
    <div class="min-h-screen lg:grid lg:grid-cols-[260px_1fr]">
        {% include "_sidebar.html" %}

        <main class="flex w-full justify-center px-4 py-6 sm:px-6 lg:px-8">
            <section class="w-full max-w-3xl bg-white rounded-xl shadow-lg p-6">
            <div class="mb-5">
                <h1 class="text-2xl font-bold text-gray-900">Add Class</h1>
                <p class="text-sm text-gray-600 mt-2">Create a class and assign one teacher with selected students.</p>
            </div>

            <form action="{{ url_for('create_class') }}" method="post" class="space-y-5">
                <div class="grid gap-4 sm:grid-cols-2">
                    <div>
                        <label for="className" class="block text-sm font-medium text-gray-700 mb-1">Class Name</label>
                        <input
                            id="className"
                            name="name"
                            type="text"
                            required
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
                    </div>

                    <div>
                        <label for="classCode" class="block text-sm font-medium text-gray-700 mb-1">Class Code</label>
                        <input
                            id="classCode"
                            name="class_code"
                            type="text"
                            required
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
                    </div>
                </div>

                <div>
                    <label for="teacherId" class="block text-sm font-medium text-gray-700 mb-1">Teacher</label>
                    <select
                        id="teacherId"
                        name="teacher_id"
                        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
                        <option value="">No teacher assigned</option>
                        {% for teacher in teachers %}
                            <option value="{{ teacher.id }}">{{ teacher.name }}{% if teacher.subject %} - {{ teacher.subject }}{% endif %}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid gap-4 sm:grid-cols-2">
                    <div>
                        <label for="startTime" class="block text-sm font-medium text-gray-700 mb-1">Start Time</label>
                        <input
                            id="startTime"
                            name="start_time"
                            type="time"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
                    </div>

                    <div>
                        <label for="endTime" class="block text-sm font-medium text-gray-700 mb-1">End Time</label>
                        <input
                            id="endTime"
                            name="end_time"
                            type="time"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
                    </div>

                    <div>
                        <label for="startPresence" class="block text-sm font-medium text-gray-700 mb-1">Start Presence</label>
                        <input
                            id="startPresence"
                            name="start_presence"
                            type="time"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
                    </div>

                    <div>
                        <label for="endPresence" class="block text-sm font-medium text-gray-700 mb-1">End Presence</label>
                        <input
                            id="endPresence"
                            name="end_presence"
                            type="time"
                            class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
                    </div>
                </div>

                <div>
                    <div class="mb-2 flex items-center justify-between gap-3">
                        <label class="block text-sm font-medium text-gray-700">Students</label>
                        <span class="text-xs text-gray-500">{{ students|length }} available</span>
                    </div>

                    <div class="max-h-72 overflow-y-auto rounded-lg border border-gray-300 bg-white">
                        {% for student in students %}
                            <label class="flex items-center gap-3 border-b border-gray-100 px-3 py-2 text-sm last:border-b-0 hover:bg-gray-50">
                                <input
                                    type="checkbox"
                                    name="student_ids"
                                    value="{{ student.id }}"
                                    class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <span>
                                    <span class="font-medium text-gray-900">{{ student.name }}</span>
                                    <span class="text-gray-500">({{ student.nim }})</span>
                                </span>
                            </label>
                        {% else %}
                            <p class="px-3 py-6 text-center text-sm text-gray-500">No students available.</p>
                        {% endfor %}
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-3 pt-2 sm:grid-cols-2">
                    <button
                        type="submit"
                        class="rounded-lg bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700">
                        Save Class
                    </button>

                    <a
                        href="{{ url_for('dashboard', section='classes') }}"
                        class="rounded-lg border border-gray-300 px-4 py-2 text-center font-medium text-gray-800 hover:bg-gray-50">
                        Back to Dashboard
                    </a>
                </div>
            </form>
        </section>
        </main>
    </div>
</body>
</html>
