<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Edit" if teacher else "Add" }} Teacher</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="min-h-screen bg-gray-100 text-gray-900">
    <div class="min-h-screen lg:grid lg:grid-cols-[260px_1fr]">
        {% include "_sidebar.html" %}

        <main class="flex w-full justify-center px-4 py-6 sm:px-6 lg:px-8">
            <section class="w-full max-w-xl bg-white rounded-xl shadow-lg p-6">
            <div class="mb-5">
                <h1 class="text-2xl font-bold text-gray-900">{{ "Edit" if teacher else "Add" }} Teacher</h1>
                <p class="text-sm text-gray-600 mt-2">Register teacher data for the dashboard.</p>
            </div>

            <form action="{{ url_for('create_teacher') }}" method="post" class="space-y-4">
                {% if teacher %}
                    <input type="hidden" name="teacher_id" value="{{ teacher.id }}">
                {% endif %}
                <div>
                    <label for="teacherName" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input
                        id="teacherName"
                        name="name"
                        type="text"
                        value="{{ teacher.name if teacher else '' }}"
                        required
                        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
                </div>

                <div>
                    <label for="teacherNip" class="block text-sm font-medium text-gray-700 mb-1">NIP</label>
                    <input
                        id="teacherNip"
                        name="nip"
                        type="text"
                        inputmode="numeric"
                        pattern="[0-9]+"
                        title="NIP must contain numbers only"
                        value="{{ teacher.nip if teacher else '' }}"
                        required
                        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
                </div>

                <div class="grid grid-cols-1 gap-3 pt-2">
                    <button
                        type="submit"
                        class="rounded-lg bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700">
                        Save Teacher
                    </button>

                    <a
                        href="{{ url_for('dashboard', section='teachers') }}"
                        class="rounded-lg border border-gray-300 px-4 py-2 text-center font-medium text-gray-800 hover:bg-gray-50">
                        Back to Dashboard
                    </a>
                </div>
            </form>
        </section>
        </main>
    </div>
</body>
</html>
