<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presence Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
    {% if error %}
        <section class="fixed right-4 top-4 z-50 w-[calc(100%-2rem)] max-w-md sm:right-6 sm:top-6" aria-live="polite">
            <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 shadow-lg">
                {{ error }}
            </div>
        </section>
    {% endif %}

    <main class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-gray-900">Presence Login</h1>
            <p class="text-sm text-gray-600 mt-2">Sign in to manage students, teachers, and users.</p>
        </div>

        <form action="{{ url_for('login') }}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
            </div>

            <div class="grid grid-cols-1 gap-3 pt-2 sm:grid-cols-2">
                <button
                    type="submit"
                    class="rounded-lg bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700">
                    Login
                </button>

                <a
                    href="{{ url_for('presence', start=1) }}"
                    class="rounded-lg border border-gray-300 px-4 py-2 text-center font-medium text-gray-800 hover:bg-gray-50">
                    Activate Camera
                </a>
            </div>
        </form>
    </main>
</body>
</html>
